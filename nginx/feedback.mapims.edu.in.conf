# Host nginx for feedback.mapims.edu.in → PFS frontend :8091

server {
    listen 80;
    server_name feedback.mapims.edu.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name feedback.mapims.edu.in;

    client_max_body_size 100m;

    ssl_certificate /etc/letsencrypt/live/feedback.mapims.edu.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feedback.mapims.edu.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
    }
}
