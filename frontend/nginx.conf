server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress the SPA bundle and any JSON nginx serves directly. API responses
    # arrive already gzipped from the Node backend and pass through untouched.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Allow large multipart uploads (voice recordings) without nginx rejecting them.
    client_max_body_size 100m;
    client_body_timeout 600s;
    send_timeout 600s;

    # 0 = instant timeout in nginx 1.31 — use explicit values instead.
    proxy_connect_timeout 60s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # index.html names the current hashed JS bundle, so it must be revalidated on
    # every load — otherwise browsers heuristically cache it and devices keep
    # running an old frontend after a deploy. SPA fallbacks land here too.
    #
    # Clear-Site-Data "cache" is TEMPORARY: it makes each device drop its HTTP
    # cache on its next visit. Deliberately NOT "storage"/"cookies" — those would
    # wipe IndexedDB (unsent offline feedback) and localStorage (login). Remove
    # this line once devices have had a few days to load the site.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Clear-Site-Data '"cache"' always;
    }

    location = /feedback-sync-sw.js {
        add_header Cache-Control "no-cache" always;
    }

    # Vite content-hashes these filenames, so they never change once published.
    # No try_files here: a missing hashed file must 404, not fall back to
    # index.html (which would then be cached as "immutable").
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Voice files live on the Node API — without this, /uploads/* falls through to SPA (HTML) and <audio> fails.
    location ^~ /uploads/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
